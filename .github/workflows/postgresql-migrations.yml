name: PostgreSQL migration smoke

on:
  pull_request:
  push:
    branches: [main, bug-fix]

permissions:
  contents: read

jobs:
  backend-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: networth_ci
          POSTGRES_PASSWORD: networth_ci_password
          POSTGRES_DB: networth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U networth_ci -d networth_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-only-secret-never-use-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_SECURE: false
      RATE_LIMIT_ENABLED: false
      DATABASE_URL: postgresql+asyncpg://networth_ci:networth_ci_password@localhost:5432/networth_ci
      TEST_DATABASE_URL: postgresql+asyncpg://networth_ci:networth_ci_password@localhost:5432/networth_ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify a single Alembic head
        run: >-
          python -c "from alembic.config import Config;
          from alembic.script import ScriptDirectory;
          heads=ScriptDirectory.from_config(Config('alembic.ini')).get_heads();
          assert len(heads) == 1, heads;
          print('Alembic head:', heads[0])"

      - name: Upgrade clean PostgreSQL database
        run: python -m alembic upgrade head

      - name: Verify migrated schema
        run: python scripts/check_migration_schema.py

      - name: Smoke-test statements revision downgrade and re-upgrade
        run: |
          python -m alembic downgrade a7b8c9d0e1f2
          python scripts/check_migration_enum_cleanup.py
          python -m alembic upgrade head
          python scripts/check_migration_schema.py

      - name: Smoke-test full downgrade to base and re-upgrade
        run: |
          python -m alembic downgrade base
          python scripts/check_migration_enum_cleanup.py
          python -m alembic upgrade head
          python scripts/check_migration_schema.py

      - name: Run backend tests on PostgreSQL
        run: python -m pytest -q
