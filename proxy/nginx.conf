events {}
http {
    upstream frontend {
        server frontend:5173;
    }
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        proxy_set_header Host $host;

        # API requests go to backend
        location /api/ {
            proxy_pass http://backend;
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://frontend;
        }
    }
}
