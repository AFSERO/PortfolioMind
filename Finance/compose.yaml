services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${II_DB_NAME:-investment_intelligence}
      POSTGRES_USER: ${II_DB_USER:-ii_local}
      POSTGRES_PASSWORD: ${II_DB_PASSWORD:?Set II_DB_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:${II_DB_PORT:-55432}:5432"
    volumes:
      - ii_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  ii_postgres_data:
